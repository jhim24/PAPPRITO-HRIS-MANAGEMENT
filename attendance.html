<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAPPRITO HRIS - Attendance</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ffcc00">

<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="css/attendance.css">

</head>

<body>

<div id="app">

<div class="container">

<div class="header">

<button id="backBtn" class="top-btn">
← BACK
</button>

<button id="printBtn" class="top-btn">
🖨 PRINT
</button>

<div class="logo">

<img src="logo.png" alt="Logo">

</div>

<div class="logo-text">
PAPPRITO
</div>

<div class="title">
EMPLOYEE ATTENDANCE
</div>
<div class="filter-section">

<select id="employeeSelect">
<option value="">Select Employee</option>
</select>

<input
type="date"
id="fromDate">

<input
type="date"
id="toDate">

<button id="filterBtn">
🔍 FILTER
</button>

<button id="summaryBtn">
📊 SUMMARY
</button>

</div>
  <div class="employee-info">

<div id="employeeId">
EMPLOYEE ID :
</div>

<div id="employeeName">
EMPLOYEE NAME :
</div>

</div>

<div class="clock-area">

<div id="clock" class="clock">
00:00:00
</div>

<div id="todayDate" class="today-date">
DATE
</div>

</div>
  <div class="button-group">

<button id="timeInBtn" class="action-btn timein">
TIME IN
</button>

<button id="breakOutBtn" class="action-btn breakout">
BREAK OUT
</button>

<button id="breakInBtn" class="action-btn breakin">
BREAK IN
</button>

<button id="timeOutBtn" class="action-btn timeout">
TIME OUT
</button>

</div>
</div>

</div>

</div>

<script type="module" src="js/attendance.js"></script>

</body>

</html>
