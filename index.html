<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>PAPPRITO HRIS</title>

<meta
name="theme-color"
content="#ffcc00">

</head>

<body
style="
margin:0;
background:#111;
">


<script type="module">

import { auth }
from "./js/firebase.js";

import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";


/* ==========================================
   PAPPRITO HRIS
   MAIN ROUTER
========================================== */

onAuthStateChanged(
    auth,
    (user)=>{

        /* ======================================
           NOT LOGGED IN
        ====================================== */

        if(!user){

            localStorage.removeItem(
                "userRole"
            );

            localStorage.removeItem(
                "loggedInUser"
            );

            window.location.replace(
                "pages/login.html"
            );

            return;

        }


        /* ======================================
           GET USER ROLE
        ====================================== */

        const role =
            localStorage.getItem(
                "userRole"
            );


        /* ======================================
           ADMIN
        ====================================== */

        if(role === "admin"){

            window.location.replace(
                "pages/dashboard.html"
            );

            return;

        }


        /* ======================================
           EMPLOYEE
        ====================================== */

        if(role === "employee"){

            window.location.replace(
                "pages/employeeportal.html"
            );

            return;

        }


        /* ======================================
           ROLE NOT FOUND
        ====================================== */

        /*
        Authenticated user but no saved role.

        Keep the Firebase session and use
        dashboard as the safe fallback.
        */

        localStorage.setItem(
            "userRole",
            "admin"
        );


        if(
            !localStorage.getItem(
                "loggedInUser"
            )
        ){

            localStorage.setItem(
                "loggedInUser",
                user.email || ""
            );

        }


        window.location.replace(
            "pages/dashboard.html"
        );

    }
);

</script>


</body>

</html>
