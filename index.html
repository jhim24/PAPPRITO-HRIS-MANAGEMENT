<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>PAPPRITO HRIS</title>

</head>

<body
style="background:#111;">

<script type="module">

import { auth }

from "./js/firebase.js";

import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

onAuthStateChanged(auth,(user)=>{

if(user){

window.location.replace(

"loading.html"

);

}else{

window.location.replace(

"login.html"

);

}

});

</script>

</body>

</html>
