<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>PAPPRITO HRIS</title>

<link
rel="stylesheet"
href="../css/loading.css">

<link
rel="icon"
href="../assets/images/logo.png">

<meta
name="theme-color"
content="#ffcc00">

</head>


<body>


<!-- ==========================================
     GRID BACKGROUND
========================================== -->

<div class="grid-bg"></div>


<!-- ==========================================
     HUD CARD
========================================== -->

<div class="hud-card">


    <!-- ======================================
         HEADER
    ====================================== -->

    <div class="logo-area">

        <img
        src="../assets/images/logo.png"
        class="logo"
        alt="PAPPRITO Logo">

        <h1>

            PAPPRITO

        </h1>

        <h2>

            HUMAN RESOURCE INFORMATION SYSTEM

        </h2>

    </div>


    <!-- ======================================
         MAIN
    ====================================== -->

    <div class="hud-main">


        <!-- ==================================
             LEFT
        ================================== -->

        <div class="hud-left">


            <!-- ==================================
                 HUD CIRCLE
            ================================== -->

            <div class="hud-circle">

                <svg
                width="220"
                height="220"
                viewBox="0 0 220 220">

                    <circle
                    class="circle-bg"
                    cx="110"
                    cy="110"
                    r="95">
                    </circle>

                    <circle
                    class="circle-progress"
                    id="circleProgress"
                    cx="110"
                    cy="110"
                    r="95">
                    </circle>

                </svg>


                <div class="circle-text">

                    <div id="percent">

                        0%

                    </div>

                    <span>

                        LOADING

                    </span>

                </div>

            </div>


            <!-- ==================================
                 LOADING TITLE
            ================================== -->

            <div
            class="loading-title"
            id="loadingText">

                Initializing HR System...

            </div>


            <!-- ==================================
                 PROGRESS BAR
            ================================== -->

            <div class="progress-container">

                <div
                class="progress-bar"
                id="progressBar">

                </div>

            </div>


        </div>


        <!-- ==================================
             RIGHT PANEL
        ================================== -->

        <div class="status-box">

            <h3>

                SYSTEM STATUS

            </h3>


            <div class="status-item">

                <span>

                    Authentication

                </span>

                <strong
                class="online">

                    SECURE

                </strong>

            </div>


            <div class="status-item">

                <span>

                    Database

                </span>

                <strong
                class="online">

                    CONNECTED

                </strong>

            </div>


            <div class="status-item">

                <span>

                    HR Modules

                </span>

                <strong
                class="online">

                    LOADING

                </strong>

            </div>


            <div class="status-item">

                <span>

                    System

                </span>

                <strong
                class="online"
                id="systemStatus">

                    🟢 Online

                </strong>

            </div>


            <!-- ==================================
                 MODULES
            ================================== -->

            <div class="module-list">


                <div class="module-item">

                    Employee Management

                </div>


                <div class="module-item">

                    Attendance

                </div>


                <div class="module-item">

                    Payroll

                </div>


                <div class="module-item">

                    HR Management

                </div>


                <div class="module-item">

                    Leave Management

                </div>


                <div class="module-item">

                    Reports

                </div>


            </div>

        </div>

    </div>


    <!-- ==========================================
         FOOTER STATUS
    ========================================== -->

    <div class="system-status">

        <div class="status-dot"></div>

        <span>

            PAPPRITO HRIS SYSTEM INITIALIZING

        </span>

    </div>


</div>


<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script
type="module"
src="../js/loading.js">

</script>


</body>

</html>
