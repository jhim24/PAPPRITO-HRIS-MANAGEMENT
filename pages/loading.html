<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>
    PAPPRITO HRIS - Loading
</title>


<!-- ==========================================
     PWA
========================================== -->

<link
    rel="manifest"
    href="../manifest.json">

<meta
    name="theme-color"
    content="#ffcc00">

<link
    rel="icon"
    href="../assets/images/logo.png">

<link
    rel="apple-touch-icon"
    href="../assets/images/icon-192.png">


<!-- ==========================================
     MATERIAL ICONS
========================================== -->

<link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet">


<!-- ==========================================
     LOADING CSS
========================================== -->

<link
    rel="stylesheet"
    href="../css/loading.css">

</head>


<body>


<!-- ==========================================
     LOADING PAGE
========================================== -->

<div class="loading-page">


    <!-- ======================================
         BACKGROUND
    ======================================= -->

    <div class="loading-background">
    </div>


    <!-- ======================================
         MAIN LOADING CARD
    ======================================= -->

    <div class="loading-card">


        <!-- ==================================
             LOGO
        ================================== -->

        <div class="logo-wrapper">

            <img
                src="../assets/images/logo.png"
                class="loading-logo"
                alt="PAPPRITO Logo">

        </div>


        <!-- ==================================
             BRAND
        ================================== -->

        <div class="loading-brand">

            <h1>
                PAPPRITO
            </h1>

            <p>
                HRIS
            </p>

        </div>


        <!-- ==================================
             TITLE
        ================================== -->

        <div class="loading-title">


            <span class="material-icons">
                security
            </span>


            <span id="loadingTitle">

                SYSTEM INITIALIZING

            </span>


        </div>


        <!-- ==================================
             MAIN STATUS
        ================================== -->

        <div
            id="authStatus"
            class="loading-status">

            CONNECTING...

        </div>


        <!-- ==================================
             PROGRESS BAR
        ================================== -->

        <div class="progress-wrapper">


            <div
                id="progressBar"
                class="progress-bar">
            </div>


        </div>


        <!-- ==================================
             PERCENT
        ================================== -->

        <div
            id="percent"
            class="loading-percent">

            0%

        </div>


        <!-- ==================================
             SYSTEM STATUS
        ================================== -->

        <div class="system-status">


            <!-- ==============================
                 AUTHENTICATION
            =============================== -->

            <div
                id="moduleAuth"
                class="status-item">


                <span class="material-icons">
                    lock
                </span>


                <div>

                    <span>
                        AUTHENTICATION
                    </span>


                    <strong
                        id="authStatus">

                        CHECKING

                    </strong>

                </div>


            </div>


            <!-- ==============================
                 DATABASE
            =============================== -->

            <div
                id="moduleDatabase"
                class="status-item">


                <span class="material-icons">
                    database
                </span>


                <div>

                    <span>
                        DATABASE
                    </span>


                    <strong
                        id="databaseStatus">

                        CHECKING

                    </strong>

                </div>


            </div>


            <!-- ==============================
                 SESSION
            =============================== -->

            <div
                id="moduleSession"
                class="status-item">


                <span class="material-icons">
                    verified_user
                </span>


                <div>

                    <span>
                        SESSION
                    </span>


                    <strong
                        id="sessionStatus">

                        CHECKING

                    </strong>

                </div>


            </div>


            <!-- ==============================
                 SYSTEM
            =============================== -->

            <div
                id="moduleSystem"
                class="status-item">


                <span class="material-icons">
                    memory
                </span>


                <div>

                    <span>
                        SYSTEM
                    </span>


                    <strong
                        id="systemStatus">

                        CHECKING

                    </strong>

                </div>


            </div>


            <!-- ==============================
                 USER ROLE
            =============================== -->

            <div class="status-item">


                <span class="material-icons">
                    badge
                </span>


                <div>

                    <span>
                        USER ROLE
                    </span>


                    <strong
                        id="roleStatus">

                        CHECKING

                    </strong>

                </div>


            </div>


        </div>


        <!-- ==================================
             FOOTER STATUS
        ================================== -->

        <div
            id="footerStatus"
            class="loading-footer">

            PAPPRITO HRIS
            <span>
                •
            </span>
            SECURE SYSTEM

        </div>


    </div>


</div>



<!-- ==========================================
     LOADING JAVASCRIPT
========================================== -->

<script
    type="module"
    src="../js/loading.js">
</script>


</body>

</html>
