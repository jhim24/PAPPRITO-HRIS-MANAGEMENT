<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>PAPPRITO HRIS - Loading</title>


<!-- ==========================================
     PWA
========================================== -->

<link
    rel="manifest"
    href="../manifest.json">

<meta
    name="theme-color"
    content="#ffcc00">

<link
    rel="icon"
    href="../assets/images/logo.png">

<link
    rel="apple-touch-icon"
    href="../assets/images/icon-192.png">


<!-- ==========================================
     MATERIAL ICONS
========================================== -->

<link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet">


<!-- ==========================================
     LOADING CSS
========================================== -->

<link
    rel="stylesheet"
    href="../css/loading.css">

</head>


<body>


<!-- ==========================================
     LOADING PAGE
========================================== -->

<div class="loading-page">


    <!-- ======================================
         BACKGROUND EFFECT
    ======================================= -->

    <div class="loading-background"></div>


    <!-- ======================================
         MAIN LOADING CARD
    ======================================= -->

    <div class="loading-card">


        <!-- LOGO -->

        <div class="logo-wrapper">

            <img
                src="../assets/images/logo.png"
                class="loading-logo"
                alt="PAPPRITO Logo">

        </div>


        <!-- BRAND -->

        <div class="loading-brand">

            <h1>
                PAPPRITO
            </h1>

            <p>
                HRIS
            </p>

        </div>


        <!-- TITLE -->

        <div class="loading-title">

            <span class="material-icons">
                security
            </span>

            SYSTEM INITIALIZING

        </div>


        <!-- STATUS -->

        <div
            id="authStatus"
            class="loading-status">

            Connecting...

        </div>


        <!-- PROGRESS -->

        <div class="progress-wrapper">

            <div
                id="progressBar"
                class="progress-bar">
            </div>

        </div>


        <!-- PERCENT -->

        <div
            id="percent"
            class="loading-percent">

            0%

        </div>


        <!-- SYSTEM STATUS -->

        <div class="system-status">


            <div class="status-item">

                <span
                    id="databaseStatusIcon"
                    class="material-icons">

                    database

                </span>

                <span>
                    DATABASE
                </span>

            </div>


            <div class="status-item">

                <span
                    id="authStatusIcon"
                    class="material-icons">

                    lock

                </span>

                <span>
                    AUTHENTICATION
                </span>

            </div>


            <div class="status-item">

                <span
                    id="systemStatusIcon"
                    class="material-icons">

                    memory

                </span>

                <span>
                    SYSTEM
                </span>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="loading-footer">

            PAPPRITO HRIS

            <span>
                •
            </span>

            SECURE SYSTEM

        </div>


    </div>

</div>


<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script
    type="module"
    src="../js/loading.js">
</script>


</body>

</html>
