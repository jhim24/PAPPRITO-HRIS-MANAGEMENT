<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PAPPRITO HRIS - Loading</title>

<link
rel="stylesheet"
href="../css/loading.css">

<link
rel="icon"
href="../assets/images/logo.png">

<meta
name="theme-color"
content="#ffcc00">

</head>


<body>


<!-- ==========================================
     LOADING HUD
========================================== -->

<div class="hud-card">


    <!-- ======================================
         LOGO
    ======================================= -->

    <div class="logo-area">

        <img
        src="../assets/images/logo.png"
        class="logo"
        alt="PAPPRITO">

        <h1>
            PAPPRITO
        </h1>

        <h2>
            HUMAN RESOURCE INFORMATION SYSTEM
        </h2>

    </div>


    <!-- ======================================
         MAIN
    ======================================= -->

    <div class="hud-main">


        <!-- ==================================
             LEFT
        =================================== -->

        <div class="hud-left">


            <div class="hud-circle">

                <svg
                width="220"
                height="220"
                viewBox="0 0 220 220">

                    <circle
                    class="circle-bg"
                    cx="110"
                    cy="110"
                    r="95">
                    </circle>

                    <circle
                    id="circleProgress"
                    class="circle-progress"
                    cx="110"
                    cy="110"
                    r="95">
                    </circle>

                </svg>


                <div class="circle-text">

                    <div id="percent">
                        0%
                    </div>

                    <span>
                        LOADING
                    </span>

                </div>

            </div>


            <div
            class="loading-title"
            id="loadingTitle">

                INITIALIZING SYSTEM...

            </div>


            <div
            class="progress-container">

                <div
                id="progressBar"
                class="progress-bar">
                </div>

            </div>


        </div>


        <!-- ==================================
             RIGHT PANEL
        =================================== -->

        <div class="hud-right">

            <div class="status-box">


                <h3>
                    SYSTEM STATUS
                </h3>


                <div class="status-item">

                    <span>
                        Authentication
                    </span>

                    <strong
                    class="online"
                    id="authStatus">

                        CHECKING

                    </strong>

                </div>


                <div class="status-item">

                    <span>
                        Database
                    </span>

                    <strong
                    class="online"
                    id="databaseStatus">

                        CONNECTING

                    </strong>

                </div>


                <div class="status-item">

                    <span>
                        User Role
                    </span>

                    <strong
                    id="roleStatus">

                        CHECKING

                    </strong>

                </div>


                <div class="status-item">

                    <span>
                        Session
                    </span>

                    <strong
                    class="online"
                    id="sessionStatus">

                        CHECKING

                    </strong>

                </div>


                <div class="status-item">

                    <span>
                        System
                    </span>

                    <strong
                    class="online"
                    id="systemStatus">

                        ONLINE

                    </strong>

                </div>


            </div>


            <!-- =================================
                 MODULES
            ================================== -->

            <div class="module-list">


                <div
                class="module-item"
                id="moduleAuth">

                    🔐 Authentication

                </div>


                <div
                class="module-item"
                id="moduleDatabase">

                    🔥 Firebase Database

                </div>


                <div
                class="module-item"
                id="moduleSession">

                    🛡 Secure Session

                </div>


                <div
                class="module-item"
                id="moduleSystem">

                    ⚙ HRIS System

                </div>


            </div>

        </div>

    </div>


    <!-- ==========================================
         FOOTER STATUS
    =========================================== -->

    <div class="system-status">

        <span class="status-dot">
        </span>

        <span id="footerStatus">

            SYSTEM INITIALIZING...

        </span>

    </div>


</div>


<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script
type="module"
src="../js/loading.js">

</script>


</body>

</html>
