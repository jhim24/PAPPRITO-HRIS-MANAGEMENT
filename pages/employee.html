<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAPPRITO HRIS | Employee Masterlist</title>

<link rel="stylesheet" href="../assets/css/employee.css">

</head>

<body>

<div class="dashboard">

<main class="main-content">

<!-- ==========================
     HEADER
========================== -->

<header class="topbar">

    <div class="header-left">

        <button
            class="back-btn"
            onclick="window.location.href='dashboard.html'">

            ← Back to Dashboard

        </button>

        <div>

            <h1>Employee Masterlist</h1>

            <p>Manage all employee information</p>

        </div>

    </div>

</header>

<!-- ==========================
     TOOLBAR
========================== -->

<section class="employee-toolbar">

    <div class="search-box">

        <input
            type="text"
            id="searchEmployee"
            placeholder="Search Employee">

    </div>

    <div class="filter-box">

        <select id="departmentFilter">

            <option value="">All Departments</option>

            <option>HR</option>

            <option>Accounting</option>

            <option>Kitchen</option>

            <option>Dining</option>

            <option>Cashier</option>

            <option>Admin</option>

        </select>

    </div>

    <button
        class="add-btn"
        id="addEmployeeBtn">

        + Add Employee

    </button>

</section>

<!-- ==========================
     EMPLOYEE TABLE
========================== -->

<section class="table-container">

<table id="employeeTable">

<thead>
<tr>

<th>Photo</th>
<th>Employee ID</th>
<th>First Name</th>
<th>Middle Name</th>
<th>Last Name</th>
<th>Birthday</th>
<th>Gender</th>
<th>Department</th>
<th>Position</th>
<th>Email</th>
<th>Mobile No.</th>
<th>SSS No.</th>
<th>PhilHealth No.</th>
<th>Pag-IBIG No.</th>
<th>TIN No.</th>
<th>Bank</th>
<th>Account No.</th>
<th>Address</th>
<th>Date Created</th>
<th>Status</th>
<th>Action</th>

</tr>
</thead>

<tbody id="employeeBody">

<!-- Employee Records -->

</tbody>

</table>

</section>
<!-- ==========================
     ADD EMPLOYEE MODAL
========================== -->

<div class="modal" id="employeeModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Add Employee</h2>

            <button id="closeModal">&times;</button>

        </div>

        <div class="modal-body">

            <div class="form-grid">

                <input
                    type="text"
                    id="empId"
                    placeholder="Employee ID">

                <input
                    type="text"
                    id="firstName"
                    placeholder="First Name">

                <input
                    type="text"
                    id="middleName"
                    placeholder="Middle Name">

                <input
                    type="text"
                    id="lastName"
                    placeholder="Last Name">

                <input
                    type="date"
                    id="birthday">

                <select id="gender">

                    <option value="">Gender</option>

                    <option>Male</option>

                    <option>Female</option>

                </select>

                <input
                    type="text"
                    id="department"
                    placeholder="Department">

                <input
                    type="text"
                    id="position"
                    placeholder="Position">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address">

                <input
                    type="text"
                    id="mobile"
                    placeholder="Mobile Number">

                <input
                    type="text"
                    id="sss"
                    placeholder="SSS Number">

                <input
                    type="text"
                    id="philhealth"
                    placeholder="PhilHealth Number">

                <input
                    type="text"
                    id="pagibig"
                    placeholder="Pag-IBIG Number">

                <input
                    type="text"
                    id="tin"
                    placeholder="TIN Number">

                <input
                    type="text"
                    id="bank"
                    placeholder="Bank Name">

                <input
                    type="text"
                    id="accountNo"
                    placeholder="Bank Account Number">

            </div>

            <textarea
                id="address"
                placeholder="Complete Address"></textarea>

        </div>

        <div class="modal-footer">

            <button
                class="cancel-btn"
                id="cancelModal">

                Cancel

            </button>

            <button
                class="save-btn"
                id="saveEmployee">

                Save Employee

            </button>

        </div>

    </div>

</div>

</main>

</div>

<script
type="module"
src="../assets/js/employee.js">

</script>

</body>

</html>
