<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PAPPRITO HRIS - Attendance</title>


<!-- ==========================================
     MANIFEST
========================================== -->

<link
rel="manifest"
href="../manifest.json">


<!-- ==========================================
     THEME
========================================== -->

<meta
name="theme-color"
content="#ffcc00">


<!-- ==========================================
     APP ICON
========================================== -->

<link
rel="apple-touch-icon"
href="../assets/images/icon-192.png">

<link
rel="icon"
href="../assets/images/logo.png">


<!-- ==========================================
     ATTENDANCE CSS
========================================== -->

<link
rel="stylesheet"
href="../css/attendance.css">

</head>


<body>


<div id="app">


<div class="container">


<!-- ==========================================
     HEADER
========================================== -->

<div class="header">


<button
id="backBtn"
class="top-btn"
onclick="window.location.href='dashboard.html'">

← BACK

</button>


<button
id="printBtn"
class="top-btn">

🖨 PRINT

</button>


<div class="logo">

<img
src="../assets/images/logo.png"
alt="Logo">

</div>


<div class="logo-text">

PAPPRITO

</div>


<div class="title">

EMPLOYEE ATTENDANCE

</div>


<!-- ==========================================
     FILTER SECTION
========================================== -->

<div class="filter-section">


<select id="employeeSelect">

<option value="">

Select Employee

</option>

</select>


<input
type="date"
id="fromDate">


<input
type="date"
id="toDate">


<button
id="filterBtn">

🔍 FILTER

</button>


<button
id="summaryBtn">

📊 SUMMARY

</button>


</div>


<!-- ==========================================
     EMPLOYEE INFORMATION
========================================== -->

<div class="employee-info">


<div id="employeeId">

EMPLOYEE ID :

</div>


<div id="employeeName">

EMPLOYEE NAME :

</div>


</div>


<!-- ==========================================
     CLOCK
========================================== -->

<div class="clock-area">


<div
id="clock"
class="clock">

00:00:00

</div>


<div
id="todayDate"
class="today-date">

DATE

</div>


</div>


<!-- ==========================================
     ATTENDANCE BUTTONS
========================================== -->

<div class="button-group">


<button
id="timeInBtn"
class="action-btn timein">

TIME IN

</button>


<button
id="breakOutBtn"
class="action-btn breakout">

BREAK OUT

</button>


<button
id="breakInBtn"
class="action-btn breakin">

BREAK IN

</button>


<button
id="timeOutBtn"
class="action-btn timeout">

TIME OUT

</button>


</div>


<!-- ==========================================
     ATTENDANCE TABLE
========================================== -->

<div class="table-wrapper">


<table id="attendanceTable">


<thead>

<tr>

<th>
DATE
</th>

<th>
EMPLOYEE ID
</th>

<th>
EMPLOYEE NAME
</th>

<th>
TIME IN
</th>

<th>
BREAK OUT
</th>

<th>
BREAK IN
</th>

<th>
TIME OUT
</th>

<th>
BREAK
</th>

<th>
REG HOURS
</th>

<th>
OT
</th>

<th>
LATE
</th>

<th>
STATUS
</th>

<th>
ACTION
</th>

</tr>

</thead>


<tbody
id="attendanceBody">

</tbody>


</table>


</div>


</div>


</div>


</div>


<!-- ==========================================
     ATTENDANCE JAVASCRIPT
========================================== -->

<script
type="module"
src="../js/attendance.js">

</script>


</body>

</html>
