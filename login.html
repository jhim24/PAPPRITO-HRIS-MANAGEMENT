<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PAPPRITO HR SYSTEM</title>

<link rel="manifest" href="/manifest.json">

<link rel="icon" href="/logo.png">

<link rel="apple-touch-icon" href="/icon-192.png">

<meta name="theme-color" content="#ffcc00">

<link
href="https://fonts.googleapis.com/icon?family=Material+Icons"
rel="stylesheet">

<link
rel="stylesheet"
href="css/login.css">

</head>

<body>

<div class="login-box">

<div class="logo-box">

<img
src="/logo.png"
class="logo"
alt="Logo">

<div class="logo-text">

PAPPRITO

</div>

</div>

<div class="title">

HR SYSTEM

</div>

<div class="subtitle">

Professional HR Login System

</div>

<select id="role">

<option value="">

Select Role

</option>

<option value="admin">

ADMIN

</option>

<option value="employee">

EMPLOYEE

</option>

</select>

<input
type="text"
id="email"
placeholder="Email or Employee ID">

<div class="password-box">

<input
type="password"
id="password"
placeholder="Password">

<span
class="show-btn"
onclick="togglePassword()">

SHOW

</span>

</div>

<div class="remember">

<input
type="checkbox"
id="remember">

<label for="remember">

Remember Me

</label>

</div>

<button
class="login-btn"
onclick="login()">

LOGIN

</button>

<button
class="login-btn"
id="fingerBtn"
style="
margin-top:10px;
background:linear-gradient(135deg,#0066cc,#004499);
color:white;
">

🔐 LOGIN WITH FINGERPRINT

</button>

</div>

<!-- FULL SCREEN LOADING -->

<div id="loading">

<div class="loader-box">

<div class="loader"></div>

<h2>

Signing In...

</h2>

<p>

Please wait...

</p>

</div>

</div>

<div class="footer">

Powered by Firebase HR System

</div>

<script
type="module"
src="js/login.js">

</script>

</body>

</html>
