<!-- ==========================================
     PAPPRITO HRIS
     LOADING HUD COMPONENT
========================================== -->

<div
    id="loadingHud"
    class="loading-hud"
    aria-hidden="true">

    <div class="loading-card">

        <div class="loading-logo-wrap">

            <img
                src="../assets/images/logo.png"
                class="loading-logo"
                alt="PAPPRITO Logo">

        </div>


        <div class="loading-brand">

            <h1>
                PAPPRITO
            </h1>

            <p>
                HRIS
            </p>

        </div>


        <div class="loading-status">

            <span
                id="loadingStatus">
                Loading...
            </span>

        </div>


        <div class="loading-progress">

            <div
                id="loadingProgressBar"
                class="loading-progress-bar">
            </div>

        </div>


        <div class="loading-percent">

            <span
                id="loadingPercent">
                0%
            </span>

        </div>

    </div>

</div>
