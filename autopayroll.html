<!DOCTYPE html>
<html>
<head>

<title>AUTO PAYROLL SYSTEM</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ffcc00">

<link rel="apple-touch-icon" href="icon-192.png">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{

margin:0;
padding:20px;

background:#1f1f1f;

color:white;
}

/* TOP */

.top-bar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

flex-wrap:wrap;

gap:10px;
}

h1{

margin:0;

color:#ffcc00;

text-shadow:2px 2px 5px black;
}

/* BUTTONS */

button{

padding:10px 18px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

background:linear-gradient(
135deg,
#ffcc00,
#ff6600
);

color:black;

transition:0.3s;

box-shadow:0 4px 10px rgba(0,0,0,0.4);
}

button:hover{

transform:translateY(-2px);

filter:brightness(1.1);

}

/* FORM */

.form-box{

background:#2b2b2b;

padding:20px;

border-radius:15px;

border:2px solid #ffcc00;

margin-bottom:20px;
}

.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:10px;
}

input,
select{

width:100%;

padding:10px;

border:2px solid #555;

border-radius:8px;

background:#1f1f1f;

color:white;
}

input:focus,
select:focus{

outline:none;

border-color:#ffcc00;
}

/* TABLE */

.table-box{

background:#2b2b2b;

border:2px solid #ffcc00;

border-radius:12px;

overflow:auto;

height:60vh;
}

table{

width:100%;

border-collapse:collapse;

min-width:2000px;
}

th,
td{

border:1px solid #555;

padding:8px;

white-space:nowrap;

text-align:center;
}

th{

background:#ffcc00;

color:black;

position:sticky;

top:0;
}

tr:nth-child(even){

background:#242424;
}

tr:hover{

background:#3a3a3a;
}

/* MOBILE */

@media(max-width:768px){

.grid{

grid-template-columns:1fr;
}

h1{

font-size:22px;
}

}

</style>

</head>

<body>

<div class="top-bar">

<h1>
🤖 AUTO PAYROLL SYSTEM
</h1>

<button
onclick="window.location.href='index.html'">

← BACK

</button>

</div>

<!-- FORM -->

<div class="form-box">

<div class="grid">

<select id="employeeName">

<option value="">
Select Employee
</option>

</select>

<input
id="employeeId"
placeholder="Employee ID"
readonly>

<input
id="salaryRate"
type="number"
placeholder="Hourly Rate">

<input
id="totalHours"
type="number"
placeholder="Regular Hours">

<input
id="overtimeHours"
type="number"
placeholder="Overtime Hours">

<select id="holidayType">

<option value="none">
No Holiday
</option>

<option value="regular">
Regular Holiday
</option>

<option value="special">
Special Holiday
</option>

</select>

<input
id="holidayHours"
type="number"
placeholder="Holiday Hours">

<input
id="nightHours"
type="number"
placeholder="Night Differential Hours">

<input
id="sss"
type="number"
placeholder="SSS Deduction">

<input
id="philhealth"
type="number"
placeholder="PhilHealth Deduction">

<input
id="pagibig"
type="number"
placeholder="Pag-IBIG Deduction">

<input
id="healthcard"
type="number"
placeholder="Health Card">

<input
id="others"
type="number"
placeholder="Other Deduction">

<input
id="grossSalary"
placeholder="Gross Salary"
readonly>

<input
id="netSalary"
placeholder="Net Salary"
readonly>

</div>

<br>

<button
onclick="computePayroll()">

🧮 COMPUTE PAYROLL

</button>

<button
onclick="savePayroll()">

💾 SAVE PAYROLL

</button>

</div>

<!-- TABLE -->

<div class="table-box">

<table id="payrollTable">

<thead>

<tr>

<th>EMPLOYEE ID</th>
<th>EMPLOYEE</th>
<th>RATE</th>
<th>REG HOURS</th>
<th>OT HOURS</th>
<th>HOLIDAY</th>
<th>HOLIDAY HOURS</th>
<th>NIGHT DIFF</th>
<th>GROSS</th>
<th>SSS</th>
<th>PHILHEALTH</th>
<th>PAGIBIG</th>
<th>HEALTH CARD</th>
<th>OTHERS</th>
<th>NET PAY</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<script type="module">

import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
addDoc

}

from
"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyAehoq0teVYHiJ4bkKOgBqIgJZrQpce3k8",

authDomain:
"hr-system-38fc3.firebaseapp.com",

projectId:
"hr-system-38fc3",

storageBucket:
"hr-system-38fc3.firebasestorage.app",

messagingSenderId:
"615471610834",

appId:
"1:615471610834:web:a0d671d4e3f4c1b57b660b"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* LOAD EMPLOYEES */

async function loadEmployees(){

let querySnapshot =

await getDocs(
collection(db,'employees')
);

querySnapshot.forEach(docSnap=>{

let emp = docSnap.data();

let fullname =

(emp.firstname || '') +
' ' +
(emp.lastname || '');

employeeName.innerHTML += `

<option
value="${fullname}"
data-id="${emp.employeeid || ''}">

${emp.employeeid || ''} - ${fullname}

</option>

`;

});

}

loadEmployees();

/* AUTO EMPLOYEE ID */

employeeName.addEventListener(
'change',
function(){

let selected =

this.options[
this.selectedIndex
];

employeeId.value =
selected.dataset.id || '';

}
);

/* COMPUTE */

window.computePayroll =
function(){

let rate =
Number(salaryRate.value || 0);

let hours =
Number(totalHours.value || 0);

let overtime =
Number(overtimeHours.value || 0);

let holidayHours =
Number(holidayHours.value || 0);

let nightHours =
Number(nightHours.value || 0);

/* BASIC */

let basicPay =
hours * rate;

/* OT */

let overtimePay =
overtime * (rate * 1.25);

/* HOLIDAY */

let holidayPay = 0;

if(holidayType.value === 'regular'){

holidayPay =
holidayHours * (rate * 2);

}

if(holidayType.value === 'special'){

holidayPay =
holidayHours * (rate * 1.30);

}

/* NIGHT DIFF */

let nightPay =
nightHours * (rate * 0.10);

/* GROSS */

let gross =

basicPay +
overtimePay +
holidayPay +
nightPay;

/* DEDUCTIONS */

let deductions =

Number(sss.value || 0) +

Number(philhealth.value || 0) +

Number(pagibig.value || 0) +

Number(healthcard.value || 0) +

Number(others.value || 0);

/* NET */

let net = gross - deductions;

/* DISPLAY */

grossSalary.value =
gross.toFixed(2);

netSalary.value =
net.toFixed(2);

}

/* SAVE PAYROLL */

window.savePayroll =
async function(){

if(employeeName.value === ''){

alert('Select Employee');

return;

}

try{

await addDoc(

collection(db,'payroll'),

{

empid:
employeeId.value,

employee:
employeeName.value,

dailyrate:
salaryRate.value,

totaldays:
totalHours.value,

overtime:
overtimeHours.value,

holidaytype:
holidayType.value,

holiday:
holidayHours.value,

nightdiff:
nightHours.value,

gross:
grossSalary.value,

sss:
sss.value,

philhealth:
philhealth.value,

pagibig:
pagibig.value,

health:
healthcard.value,

other:
others.value,

deductions:

(
Number(sss.value || 0) +

Number(philhealth.value || 0) +

Number(pagibig.value || 0) +

Number(healthcard.value || 0) +

Number(others.value || 0)

).toFixed(2),

net:
netSalary.value,

date:
new Date()
.toLocaleDateString()

}

);

alert('Payroll Saved');

loadPayroll();

}catch(error){

console.log(error);

alert('Save Error');

}

}

/* LOAD PAYROLL */

async function loadPayroll(){

let tbody =

document.querySelector(
'#payrollTable tbody'
);

tbody.innerHTML = '';

let querySnapshot =

await getDocs(
collection(db,'payroll')
);

querySnapshot.forEach(docSnap=>{

let pay = docSnap.data();

tbody.innerHTML += `

<tr>

<td>${pay.empid || ''}</td>

<td>${pay.employee || ''}</td>

<td>${pay.dailyrate || 0}</td>

<td>${pay.totaldays || 0}</td>

<td>${pay.overtime || 0}</td>

<td>${pay.holidaytype || ''}</td>

<td>${pay.holiday || 0}</td>

<td>${pay.nightdiff || 0}</td>

<td>${pay.gross || 0}</td>

<td>${pay.sss || 0}</td>

<td>${pay.philhealth || 0}</td>

<td>${pay.pagibig || 0}</td>

<td>${pay.health || 0}</td>

<td>${pay.other || 0}</td>

<td>${pay.net || 0}</td>

</tr>

`;

});

}

loadPayroll();

</script>

</body>
</html>
