<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>PAPPRITO HRIS - Initializing</title>

<link rel="icon" href="logo.png">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#07131d">

<link rel="stylesheet" href="css/loading.css">

</head>

<body>

<!-- GRID BACKGROUND -->

<div class="grid-bg"></div>

<!-- HUD PANEL -->

<div class="hud-card">

    <!-- ==========================================
         HEADER
    ========================================== -->

    <div class="logo-area">

        <img
        src="logo.png"
        class="logo"
        alt="Papprito Logo">

        <h1>PAPPRITO</h1>

        <h2>HR MANAGEMENT SYSTEM</h2>

    </div>

    <!-- ==========================================
         MAIN HUD
    ========================================== -->

    <div class="hud-main">

        <!-- LEFT -->

        <div class="hud-left">

            <div class="hud-circle">

                <svg width="220" height="220">

                    <circle
                    class="circle-bg"
                    cx="110"
                    cy="110"
                    r="95"></circle>

                    <circle
                    id="progressCircle"
                    class="circle-progress"
                    cx="110"
                    cy="110"
                    r="95"></circle>

                </svg>

                <div class="circle-text">

                    <div id="percent">

                        0%

                    </div>

                    <span>

                        INITIALIZING

                    </span>

                </div>

            </div>

            <div
            id="loadingTitle"
            class="loading-title">

                Connecting to Firebase...

            </div>

            <div class="progress-container">

                <div
                id="progressBar"
                class="progress-bar">

                </div>

            </div>

        </div>

        <!-- RIGHT -->

        <div class="hud-right">

            <div class="status-box">

                <h3>SYSTEM STATUS</h3>

                <div class="status-item">

                    <span>CPU</span>

                    <strong id="cpuUsage">0%</strong>

                </div>

                <div class="status-item">

                    <span>MEMORY</span>

                    <strong id="ramUsage">0%</strong>

                </div>

                <div class="status-item">

                    <span>DATABASE</span>

                    <strong class="online">

                        CONNECTING

                    </strong>

                </div>

                <div class="status-item">

                    <span>NETWORK</span>

                    <strong class="online">

                        ONLINE

                    </strong>

                </div>

            </div>

        </div>

    </div>

    <!-- ==========================================
         MODULES
    ========================================== -->

    <div class="module-list">

        <div
        id="step1"
        class="module-item">

            Firebase

        </div>

        <div
        id="step2"
        class="module-item">

            Employees

        </div>

        <div
        id="step3"
        class="module-item">

            Attendance

        </div>

        <div
        id="step4"
        class="module-item">

            Payroll

        </div>

        <div
        id="step5"
        class="module-item">

            Dashboard

        </div>

        <div
        id="step6"
        class="module-item">

            System Ready

        </div>

    </div>

    <!-- ==========================================
         FOOTER
    ========================================== -->

    <div class="system-status">

        <div class="status-dot"></div>

        <span>

            PAPPRITO HRIS v2.0 • FIREBASE • INITIALIZING...

        </span>

    </div>

</div>

<script
type="module"
src="js/loading.js">

</script>

</body>
</html>
