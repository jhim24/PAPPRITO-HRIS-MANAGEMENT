<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAPPRITO HRIS - Initializing</title>

<link rel="manifest" href="manifest.json">

<link rel="icon" href="logo.png">

<meta name="theme-color" content="#ffcc00">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<link rel="stylesheet" href="css/loading.css">

</head>

<body>

<div class="hud-container">

    <!-- Background Grid -->

    <div class="grid-bg"></div>

    <!-- HUD Card -->

    <div class="hud-card">

        <!-- Logo -->

        <div class="logo-area">

            <img src="logo.png" class="logo">

            <h1>PAPPRITO</h1>

            <h2>HR MANAGEMENT SYSTEM</h2>

        </div>

        <!-- Circular Loader -->

        <div class="hud-circle">

            <svg width="240" height="240">

                <circle
                    class="circle-bg"
                    cx="120"
                    cy="120"
                    r="95">
                </circle>

                <circle
                    id="progressCircle"
                    class="circle-progress"
                    cx="120"
                    cy="120"
                    r="95">
                </circle>

            </svg>

            <div class="circle-text">

                <div id="percent">

                    0%

                </div>

                <span>

                    INITIALIZING

                </span>

            </div>

        </div>

        <!-- Status -->

        <div id="loadingTitle" class="loading-title">

            Connecting to Firebase...

        </div>

        <!-- Progress Bar -->

        <div class="progress-container">

            <div id="progressBar" class="progress-bar"></div>

        </div>

        <!-- Loading Modules -->

        <div class="module-list">

            <div id="step1" class="module-item">

                ⏳ Connecting Firebase...

            </div>

            <div id="step2" class="module-item">

                ⏳ Loading Employees...

            </div>

            <div id="step3" class="module-item">

                ⏳ Loading Attendance...

            </div>

            <div id="step4" class="module-item">

                ⏳ Loading Payroll...

            </div>

            <div id="step5" class="module-item">

                ⏳ Loading Dashboard...

            </div>

            <div id="step6" class="module-item">

                ⏳ Preparing Interface...

            </div>

        </div>

        <!-- Bottom Status -->

        <div class="system-status">

            <span class="status-dot"></span>

            SYSTEM INITIALIZATION IN PROGRESS

        </div>

    </div>

</div>

<script type="module" src="js/loading.js"></script>

</body>

</html>
